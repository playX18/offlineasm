[package]
name = "offlineasm-ir"
version = "0.2.0"
edition = "2021"
description = "Shared mnemonic IR for the offlineasm and onlineasm assemblers"
license = "BSD-3-Clause"
authors = ["Adel Prokurov <adel.prokurov@gmail.com>"]

repository = "https://codeberg.org/playxe/offlineasm"
documentation = "https://docs.rs/offlineasm-ir"
keywords = ["assembler", "jit", "portable"]
categories = ["development-tools"]
rust-version = "1.85"
include = ["/src/**/*", "/README.md", "/LICENSE"]

[lib]
name = "offlineasm_ir"
path = "src/lib.rs"
