[package]
name = "offlineasm"
version.workspace = true
edition = "2021"
description = "Portable assembler for Rust"
license = "BSD-3-Clause"
authors = ["Adel Prokurov <adel.prokurov@gmail.com>"]
repository = "https://codeberg.org/playxe/offlineasm"
documentation = "https://docs.rs/offlineasm"
keywords = ["assembler", "jit", "portable"]
rust-version = "1.85"


[dependencies]
offlineasm-macros = { path = "../offlineasm-macros", version = "0.3.2" }

[dev-dependencies]
offlineasm-backend = { path = "../offlineasm-backend", version = "0.3.2" }
onlineasm = { path = "../onlineasm", version = "0.3.2" }

[build-dependencies]
offlineasm-backend = { path = "../offlineasm-backend", version = "0.3.2" }
