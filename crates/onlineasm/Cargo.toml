[package]
name = "onlineasm"
version.workspace = true
edition = "2021"
description = "Minimal portable runtime assembler with offlineasm mnemonics"
license = "BSD-3-Clause"
authors = ["Adel Prokurov <adel.prokurov@gmail.com>"]

repository.workspace = true
documentation = "https://docs.rs/onlineasm"
keywords = ["assembler", "jit", "portable"]
categories = ["development-tools"]
rust-version = "1.85"
include = [
    "/src/**/*",
    "/examples/**/*",
    "/tests/**/*",
    "/benches/**/*",
    "/docs/**/*",
    "/build.rs",
    "/README.md",
    "/LICENSE",
]

[lib]
name = "onlineasm"
path = "src/lib.rs"

[dependencies]
asmkit-rs = { version = "0.8.0", features = ["x86", "aarch64", "riscv", "jit"] }
offlineasm-ir = { path = "../offlineasm-ir", version = "0.4.0" }
onlineasm-macros = { path = "../onlineasm-macros", version = "0.4.0" }
smallvec = "1"

[dev-dependencies]
capstone = "0.14"
criterion = "0.5"
offlineasm-backend = { path = "../offlineasm-backend", version = "0.4.0" }

[[bench]]
name = "emit_mix"
harness = false

[build-dependencies]
offlineasm-backend = { path = "../offlineasm-backend", version = "0.4.0" }
